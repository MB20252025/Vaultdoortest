<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safe Door – Binary Puzzle</title>
  <style>
    /* ── Reset & base ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1410;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-image: radial-gradient(ellipse at center, #2d221c 0%, #0d0a08 100%);
    }

    /* ── Main safe container ── */
    #safe-container {
      position: relative;
      width: 700px;
      height: 550px;
      background: #2a211c;
      border-radius: 28px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), inset 0 2px 4px rgba(255, 255, 255, 0.06);
      border: 6px solid #1f1814;
      overflow: hidden;
    }

    /* ── Door background (vaultdoor.jpg) ── */
    #safe-door {
      position: relative;
      width: 100%;
      height: 100%;
      background: url('vaultdoor.jpg') no-repeat center / cover;
      border-radius: 22px;
      /* fallback if image missing */
      background-color: #4a3d35;
    }

    /* ── Decorative rivets (not essential) ── */
    .rivet {
      position: absolute;
      width: 14px;
      height: 14px;
      background: radial-gradient(circle at 35% 35%, #6b5a4f, #2a1f1a);
      border-radius: 50%;
      box-shadow: inset 0 -2px 4px rgba(0, 0, 0, 0.7), inset 0 2px 3px rgba(255, 255, 255, 0.15);
      pointer-events: none;
    }
    .rivet:nth-child(1) { top: 22px; left: 22px; }
    .rivet:nth-child(2) { top: 22px; right: 22px; }
    .rivet:nth-child(3) { bottom: 22px; left: 22px; }
    .rivet:nth-child(4) { bottom: 22px; right: 22px; }
    .rivet:nth-child(5) { top: 50%; left: 22px; transform: translateY(-50%); }
    .rivet:nth-child(6) { top: 50%; right: 22px; transform: translateY(-50%); }

    /* ── Bolt wrappers – adjust these values for pixel‑perfect overlay ── */
    .bolt-wrapper {
      position: absolute;
      width: 76px;      /* match your bolt image width */
      height: 44px;     /* match your bolt image height */
      z-index: 10;
      pointer-events: none; /* let clicks pass through to wheel */
    }
    /* Left top bolt */
    .bolt-wrapper.left-top {
      top: 84px;        /* fine‑tune this */
      left: 8px;        /* fine‑tune this */
    }
    /* Left bottom bolt */
    .bolt-wrapper.left-bottom {
      top: 336px;       /* fine‑tune this */
      left: 8px;        /* fine‑tune this */
    }
    /* Right middle bolt */
    .bolt-wrapper.right-middle {
      top: 210px;       /* fine‑tune this */
      right: 6px;       /* fine‑tune this */
    }

    .bolt-wrapper img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: scale(0.95);
    }
    .bolt-wrapper.unlocked img {
      opacity: 1;
      transform: scale(1);
    }

    /* ── Keypad (bottom‑right) – now using keypad.jpg ── */
    #keypad {
      position: absolute;
      bottom: 32px;
      right: 28px;
      width: 86px;
      height: 56px;
      cursor: pointer;
      z-index: 20;
      background: url('keypad.jpg') no-repeat center / contain;
      transition: filter 0.2s, transform 0.1s;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.7));
    }
    #keypad:hover {
      filter: drop-shadow(0 4px 12px rgba(200, 180, 140, 0.4)) brightness(1.1);
    }
    #keypad:active {
      transform: scale(0.94);
    }

    /* ── Wheel (centre) ── */
    #wheel {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      background: url('wheel.png') no-repeat center / contain;
      cursor: pointer;
      z-index: 15;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.6));
      transition: filter 0.2s;
      /* initial "locked" jiggle */
      animation: wheelJiggle 2s ease-in-out infinite;
    }
    #wheel:hover {
      filter: drop-shadow(0 6px 16px rgba(200, 180, 140, 0.3)) brightness(1.05);
    }
    /* Jiggle: small left/right wobble */
    @keyframes wheelJiggle {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      25% { transform: translate(-50%, -50%) rotate(4deg); }
      75% { transform: translate(-50%, -50%) rotate(-4deg); }
      100% { transform: translate(-50%, -50%) rotate(0deg); }
    }
    /* Full spin (used when door is unlocked) */
    @keyframes wheelSpin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    #wheel.spinning {
      animation: wheelSpin 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      pointer-events: none; /* prevent double‑clicks during spin */
    }

    /* ── Modal overlay (binary puzzle page) ── */
    #modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: none; /* hidden by default */
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #modal-overlay.active {
      display: flex;
    }
    .modal-box {
      background: #1f1814;
      padding: 30px 30px 24px;
      border-radius: 28px;
      border: 2px solid #4a3d35;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
      text-align: center;
      max-width: 90%;
      position: relative;
    }
    .modal-box img {
      max-width: 520px;
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #3d322c;
    }
    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 20px;
      align-items: center;
    }
    #unlock-btn {
      background: #5a4a3a;
      border: none;
      color: #f0e6d8;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 12px 36px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 0 #2a1f1a, 0 6px 12px rgba(0, 0, 0, 0.4);
      transition: 0.08s linear;
      letter-spacing: 0.5px;
      background: linear-gradient(145deg, #6b5a4a, #3d322c);
    }
    #unlock-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #2a1f1a, 0 6px 12px rgba(0, 0, 0, 0.4);
    }
    #unlock-btn:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: 0 0px 0 #2a1f1a;
      pointer-events: none;
    }
    #close-modal {
      background: none;
      border: none;
      color: #b8a89a;
      font-size: 2rem;
      cursor: not-allowed;
      padding: 0 12px;
      transition: color 0.2s;
      opacity: 0.5;
    }
    #close-modal.enabled {
      cursor: pointer;
      opacity: 1;
      color: #f0e6d8;
    }
    #close-modal.enabled:hover {
      color: #ffccaa;
    }
    .modal-status {
      color: #b8a89a;
      font-size: 0.9rem;
      margin-top: 12px;
      min-height: 1.5em;
    }

    /* ── Responsive (optional) ── */
    @media (max-width: 720px) {
      #safe-container { width: 95vw; height: 75vw; }
      .bolt-wrapper { width: 11vw; height: 6.5vw; }
      .bolt-wrapper.left-top { top: 12vw; left: 1vw; }
      .bolt-wrapper.left-bottom { top: 50vw; left: 1vw; }
      .bolt-wrapper.right-middle { top: 30vw; right: 1vw; }
      #keypad { width: 13vw; height: 8vw; bottom: 4vw; right: 4vw; }
      #wheel { width: 18vw; height: 18vw; }
    }
  </style>
</head>
<body>

<div id="safe-container">
  <div id="safe-door">
    <!-- Rivets (just for looks) -->
    <div class="rivet"></div><div class="rivet"></div>
    <div class="rivet"></div><div class="rivet"></div>
    <div class="rivet"></div><div class="rivet"></div>

    <!-- Bolt overlays (initially hidden) -->
    <div class="bolt-wrapper left-top" id="bolt1">
      <img src="unlockbolt1.png" alt="unlock bolt 1" />
    </div>
    <div class="bolt-wrapper left-bottom" id="bolt2">
      <img src="unlockbolt2.png" alt="unlock bolt 2" />
    </div>
    <div class="bolt-wrapper right-middle" id="bolt3">
      <img src="unlockbolt3.png" alt="unlock bolt 3" />
    </div>

    <!-- Keypad (clickable) – now using keypad.jpg -->
    <div id="keypad" title="Click to access binary puzzle"></div>

    <!-- Wheel (centre) -->
    <div id="wheel" title="Spin the wheel"></div>
  </div>
</div>

<!-- Modal overlay (binary puzzle page) -->
<div id="modal-overlay">
  <div class="modal-box">
    <img src="bcode.png" alt="Binary puzzle" id="bcode-img" />
    <div class="modal-actions">
      <button id="unlock-btn">🔓 Unlock Door</button>
      <button id="close-modal" disabled>✕</button>
    </div>
    <div class="modal-status" id="modal-status">Click the button to unlock the door.</div>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ── DOM refs ──
    const modalOverlay = document.getElementById('modal-overlay');
    const unlockBtn = document.getElementById('unlock-btn');
    const closeModalBtn = document.getElementById('close-modal');
    const modalStatus = document.getElementById('modal-status');
    const keypad = document.getElementById('keypad');
    const wheel = document.getElementById('wheel');
    const boltWrappers = [
      document.getElementById('bolt1'),
      document.getElementById('bolt2'),
      document.getElementById('bolt3')
    ];

    // ── State ──
    let isUnlocked = false;      // door unlocked by binary puzzle?
    let isSpinning = false;     // wheel currently spinning?
    let boltsRevealed = false;  // have bolts been shown already?

    // ── Helpers ──
    function showModal() {
      modalOverlay.classList.add('active');
      // Reset status if not unlocked yet
      if (!isUnlocked) {
        modalStatus.textContent = 'Click the button to unlock the door.';
        unlockBtn.disabled = false;
        closeModalBtn.disabled = true;
        closeModalBtn.classList.remove('enabled');
      } else {
        // Already unlocked: just show info and enable close
        modalStatus.textContent = '✅ Door is already unlocked! Close this window.';
        unlockBtn.disabled = true;
        closeModalBtn.disabled = false;
        closeModalBtn.classList.add('enabled');
      }
    }

    function hideModal() {
      modalOverlay.classList.remove('active');
    }

    // Unlock the door (called from button)
    function unlockDoor() {
      if (isUnlocked) return;
      isUnlocked = true;
      unlockBtn.disabled = true;
      closeModalBtn.disabled = false;
      closeModalBtn.classList.add('enabled');
      modalStatus.textContent = '✅ Door unlocked! Close this window, then click the wheel.';
      // Enable close button
    }

    // Reveal bolts one by one with delay
    function revealBolts() {
      if (boltsRevealed) return;
      boltsRevealed = true;
      boltWrappers.forEach((wrapper, index) => {
        setTimeout(() => {
          wrapper.classList.add('unlocked');
        }, index * 400); // 400ms between each bolt
      });
    }

    // Handle wheel click
    function onWheelClick() {
      if (isSpinning) return;
      if (!isUnlocked) {
        // Wheel is locked – just jiggles (animation already active)
        // Maybe add a little feedback: quick extra jiggle
        wheel.style.animation = 'none';
        void wheel.offsetHeight; // force reflow
        wheel.style.animation = 'wheelJiggle 0.6s ease-in-out 2';
        setTimeout(() => {
          wheel.style.animation = 'wheelJiggle 2s ease-in-out infinite';
        }, 1200);
        return;
      }

      // ── Door is unlocked: full spin + reveal bolts ──
      isSpinning = true;
      // Remove jiggle, trigger spin
      wheel.style.animation = 'none';
      void wheel.offsetHeight;
      wheel.classList.add('spinning');

      // After spin ends (1.8s), reveal bolts and reset to jiggle (or idle)
      setTimeout(() => {
        wheel.classList.remove('spinning');
        // Reveal bolts (if not already)
        revealBolts();
        // After bolts are revealed, we can set wheel back to jiggle or static
        // We'll leave it static (no jiggle) to indicate it's now free.
        wheel.style.animation = 'none';
        // Optionally, make wheel spin freely on further clicks? We'll keep it static.
        isSpinning = false;
        // Disable further wheel clicks? We'll allow but do nothing.
      }, 1800);
    }

    // ── Event listeners ──
    keypad.addEventListener('click', showModal);

    unlockBtn.addEventListener('click', unlockDoor);

    closeModalBtn.addEventListener('click', function() {
      if (this.disabled) return;
      hideModal();
      // If door is unlocked, the wheel is now ready to spin
      // (no extra action needed)
    });

    wheel.addEventListener('click', onWheelClick);

    // Close modal by clicking outside the box (optional)
    modalOverlay.addEventListener('click', function(e) {
      if (e.target === modalOverlay) {
        if (!closeModalBtn.disabled) {
          hideModal();
        }
      }
    });

    // ── Initial state ──
    // Ensure bolts are hidden
    boltWrappers.forEach(w => w.classList.remove('unlocked'));
    // Wheel jiggle is active via CSS

    console.log('Safe door ready – click keypad to start.');
  })();
</script>
</body>
</html>
