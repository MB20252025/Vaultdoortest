<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Safe Door – Binary Puzzle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #1a1410;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ═══════════════════════════════════════════════════════════ */
    /* ── OVERALL DOOR SCALE – change this number ── */
    :root {
      --door-scale: 1.0;    /* <── adjust overall size */
    }

    /* ── Individual element scales ── */
    :root {
      --bolt-scale: 1.70;    /* unlockbolt1/2/3.png */
      --keypad-scale: 0.8;   /* keypad.jpg – scale if needed */
      --wheel-scale: 1.65;   /* wheel.png */
      --bcode-scale: 1.0;    /* bcode.png – adjust to fit screen */
      --redlight-scale: 1.5; /* redlight scale */
    }

    /* ── Full‑screen container – centers the door ── */
    #safe-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1a1410;
    }

    /* ── Door wrapper – fits in viewport, then scaled ── */
    #door-wrapper {
      position: relative;
      width: min(100vw, calc(100vh * 700 / 550));
      height: min(100vh, calc(100vw * 550 / 700));
      transform: scale(var(--door-scale));
      transform-origin: center;
      background: url('vaultdoor.jpg') no-repeat center / contain;
      background-color: #2a211c;
      box-shadow: 0 0 0 4px #1a1410;
    }

    /* ── BOLT WRAPPERS (positions based on original 700×550) ── */
    .bolt-wrapper {
      position: absolute;
      width: 10.86%;
      height: 8%;
      z-index: 10;
      pointer-events: none;
    }
    .bolt-wrapper.left-top {
      top: 25.40%;
      left: 21.91%;
    }
    .bolt-wrapper.left-bottom {
      top: 48.00%;
      left: 68.81%;
    }
    .bolt-wrapper.right-middle {
      top: 72.18%;
      right: 67.60%;
    }

    .bolt-wrapper img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: scale(var(--bolt-scale));
      transform-origin: center;
    }
    .bolt-wrapper.unlocked img {
      opacity: 1;
    }

    /* ═══════════════════════════════════════════════════════════ */
    /* ── RED LIGHT – YOUR EXACT POSITIONS (top:10%, left:30%) ── */
    /* ═══════════════════════════════════════════════════════════ */
    #redlight-wrapper {
      position: absolute;
      top: 10%;
      left: 30%;
      width: 8%;
      height: 8%;
      transform: translateX(-50%) scale(var(--redlight-scale));
      transform-origin: center;
      z-index: 12;
      pointer-events: none;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 4px solid #111111;
      background: #111111;
      box-shadow: 
        inset 0 0 10px rgba(0, 0, 0, 0.9),
        0 0 12px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Outer glow halo */
    #redlight-wrapper::before {
      content: '';
      position: absolute;
      top: -30%;
      left: -30%;
      width: 160%;
      height: 160%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 30, 0, 0.25), transparent 70%);
      filter: blur(20px);
      opacity: 0;
      animation: haloPulse 1.2s ease-in-out infinite;
      pointer-events: none;
      z-index: -1;
      transition: background 0.6s ease;
    }

    /* ── RED LIGHT BULB ── */
    #redlight {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 45% 35%, #ff6644, #cc0000 40%, #880000 70%, #440000 100%);
      box-shadow: 
        inset 0 -6px 10px rgba(0, 0, 0, 0.7),
        inset 0 6px 14px rgba(255, 200, 150, 0.5),
        0 0 30px rgba(255, 0, 0, 0.6);
      animation: redPulse 1.2s ease-in-out infinite;
      flex-shrink: 0;
      filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.4));
      transition: background 0.8s ease, box-shadow 0.8s ease, filter 0.8s ease;
    }

    /* ── PULSING ANIMATIONS ── */
    @keyframes redPulse {
      0% {
        box-shadow: inset 0 -6px 10px rgba(0, 0, 0, 0.7), inset 0 6px 14px rgba(255, 200, 150, 0.5), 0 0 30px rgba(255, 0, 0, 0.6);
        filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.4));
      }
      50% {
        box-shadow: inset 0 -6px 10px rgba(0, 0, 0, 0.7), inset 0 6px 24px rgba(255, 200, 150, 0.8), 0 0 70px rgba(255, 0, 0, 0.9), 0 0 120px rgba(255, 50, 0, 0.4);
        filter: drop-shadow(0 0 45px rgba(255, 0, 0, 0.7));
      }
      100% {
        box-shadow: inset 0 -6px 10px rgba(0, 0, 0, 0.7), inset 0 6px 14px rgba(255, 200, 150, 0.5), 0 0 30px rgba(255, 0, 0, 0.6);
        filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.4));
      }
    }

    @keyframes haloPulse {
      0% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 0.9; transform: scale(1.3); }
      100% { opacity: 0.3; transform: scale(0.9); }
    }

    /* ── GREEN LIGHT STATE ── */
    #redlight-wrapper.green #redlight {
      background: radial-gradient(circle at 45% 35%, #88ff66, #00cc44 40%, #008833 70%, #004422 100%);
      box-shadow: 
        inset 0 -6px 10px rgba(0, 0, 0, 0.7),
        inset 0 6px 14px rgba(200, 255, 150, 0.5),
        0 0 40px rgba(0, 255, 68, 0.7),
        0 0 80px rgba(0, 255, 68, 0.3);
      filter: drop-shadow(0 0 35px rgba(0, 255, 68, 0.5));
      animation: greenPulse 1.5s ease-in-out infinite;
    }

    #redlight-wrapper.green::before {
      background: radial-gradient(circle, rgba(0, 255, 68, 0.25), transparent 70%);
    }

    @keyframes greenPulse {
      0% {
        box-shadow: inset 0 -6px 10px rgba(0, 0, 0, 0.7), inset 0 6px 14px rgba(200, 255, 150, 0.5), 0 0 40px rgba(0, 255, 68, 0.7), 0 0 80px rgba(0, 255, 68, 0.3);
        filter: drop-shadow(0 0 35px rgba(0, 255, 68, 0.5));
      }
      50% {
        box-shadow: inset 0 -6px 10px rgba(0, 0, 0, 0.7), inset 0 6px 24px rgba(200, 255, 150, 0.8), 0 0 70px rgba(0, 255, 68, 1), 0 0 140px rgba(0, 255, 68, 0.5);
        filter: drop-shadow(0 0 60px rgba(0, 255, 68, 0.7));
      }
      100% {
        box-shadow: inset 0 -6px 10px rgba(0, 0, 0, 0.7), inset 0 6px 14px rgba(200, 255, 150, 0.5), 0 0 40px rgba(0, 255, 68, 0.7), 0 0 80px rgba(0, 255, 68, 0.3);
        filter: drop-shadow(0 0 35px rgba(0, 255, 68, 0.5));
      }
    }

    /* ── WHEEL – continuous spinning ── */
    @keyframes wheelSpinContinuous {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #wheel.spinning {
      animation: wheelSpinContinuous 1.2s linear infinite !important;
      pointer-events: none;
    }

    /* ── WHEEL – jiggle (locked state) ── */
    #wheel {
      width: 100%;
      height: 100%;
      background: url('wheel.png') no-repeat center / contain;
      cursor: pointer;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.6));
      transition: filter 0.2s;
      animation: wheelJiggle 2s ease-in-out infinite;
      pointer-events: auto;
    }
    #wheel:hover {
      filter: drop-shadow(0 6px 16px rgba(200, 180, 140, 0.3)) brightness(1.05);
    }

    @keyframes wheelJiggle {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(4deg); }
      75% { transform: rotate(-4deg); }
      100% { transform: rotate(0deg); }
    }

    /* ── WHEEL WRAPPER ── */
    #wheel-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 17.14%;
      height: 21.82%;
      z-index: 15;
      transform: translate(-50%, -50%) scale(var(--wheel-scale));
      transform-origin: center;
      pointer-events: none;
    }
    #wheel-wrapper .wheel-inner {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── KEYPAD ── */
    #keypad {
      position: absolute;
      top: 80%;
      left: 65%;
      width: 30%;
      height: 24%;
      transform: translate(-50%, -50%) scale(var(--keypad-scale));
      transform-origin: center;
      z-index: 20;
      cursor: pointer;
      background: url('keypad.jpg') no-repeat center / contain;
      transition: filter 0.2s, transform 0.1s;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.7));
    }
    #keypad:hover {
      filter: drop-shadow(0 4px 12px rgba(200, 180, 140, 0.4)) brightness(1.1);
    }
    #keypad:active {
      transform: translate(-50%, -50%) scale(0.94);
    }

    /* ── MODAL ── */
    #modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 12px;
    }
    #modal-overlay.active {
      display: flex;
    }
    .modal-box {
      background: #1f1814;
      padding: 24px 24px 20px;
      border-radius: 28px;
      border: 2px solid #4a3d35;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
      text-align: center;
      max-width: 96vw;
      max-height: 96vh;
      overflow: visible;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
    }
    .modal-box img {
      max-width: 100%;
      max-height: 65vh;
      width: auto;
      height: auto;
      display: block;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid #3d322c;
      transform: scale(var(--bcode-scale));
      transform-origin: center;
      flex-shrink: 0;
    }
    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 20px;
      align-items: center;
      flex-shrink: 0;
      width: 100%;
      padding-bottom: 2px;
    }
    #unlock-btn {
      background: #5a4a3a;
      border: none;
      color: #f0e6d8;
      font-size: 1.2rem;
      font-weight: 600;
      padding: 12px 36px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 0 #2a1f1a, 0 6px 12px rgba(0, 0, 0, 0.4);
      transition: 0.08s linear;
      letter-spacing: 0.5px;
      background: linear-gradient(145deg, #6b5a4a, #3d322c);
      flex-shrink: 0;
    }
    #unlock-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 #2a1f1a, 0 6px 12px rgba(0, 0, 0, 0.4);
    }
    #unlock-btn:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: 0 0px 0 #2a1f1a;
      pointer-events: none;
    }
    #close-modal {
      background: none;
      border: none;
      color: #b8a89a;
      font-size: 2rem;
      cursor: not-allowed;
      padding: 0 12px;
      transition: color 0.2s;
      opacity: 0.5;
      flex-shrink: 0;
    }
    #close-modal.enabled {
      cursor: pointer;
      opacity: 1;
      color: #f0e6d8;
    }
    #close-modal.enabled:hover {
      color: #ffccaa;
    }
    .modal-status {
      color: #b8a89a;
      font-size: 0.9rem;
      margin-top: 8px;
      min-height: 1.5em;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div id="safe-container">
  <div id="door-wrapper">
    <!-- RED WARNING LIGHT -->
    <div id="redlight-wrapper">
      <div id="redlight"></div>
    </div>

    <!-- BOLTS -->
    <div class="bolt-wrapper left-top" id="bolt1">
      <img src="unlockbolt1.jpg" alt="unlock bolt 1" />
    </div>
    <div class="bolt-wrapper left-bottom" id="bolt2">
      <img src="unlockbolt2.png" alt="unlock bolt 2" />
    </div>
    <div class="bolt-wrapper right-middle" id="bolt3">
      <img src="unlockbolt3.png" alt="unlock bolt 3" />
    </div>

    <!-- KEYPAD -->
    <div id="keypad" title="Click to access binary puzzle"></div>

    <!-- WHEEL -->
    <div id="wheel-wrapper">
      <div id="wheel" class="wheel-inner" title="Spin the wheel"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div class="modal-box">
    <img src="bcode.png" alt="Binary puzzle" id="bcode-img" />
    <div class="modal-actions">
      <button id="unlock-btn">🔓 Unlock Door</button>
      <button id="close-modal" disabled>✕</button>
    </div>
    <div class="modal-status" id="modal-status">Click the button to unlock the door.</div>
  </div>
</div>

<script>
  (function() {
    const modalOverlay = document.getElementById('modal-overlay');
    const unlockBtn = document.getElementById('unlock-btn');
    const closeModalBtn = document.getElementById('close-modal');
    const modalStatus = document.getElementById('modal-status');
    const keypad = document.getElementById('keypad');
    const wheel = document.getElementById('wheel');
    const redlightWrapper = document.getElementById('redlight-wrapper');
    const boltWrappers = [
      document.getElementById('bolt1'),
      document.getElementById('bolt2'),
      document.getElementById('bolt3')
    ];

    let isUnlocked = false;
    let isSpinning = false;
    let boltsRevealed = false;
    let spinTimeout = null;

    function showModal() {
      modalOverlay.classList.add('active');
      if (!isUnlocked) {
        modalStatus.textContent = 'Click the button to unlock the door.';
        unlockBtn.disabled = false;
        closeModalBtn.disabled = true;
        closeModalBtn.classList.remove('enabled');
      } else {
        modalStatus.textContent = '✅ Door is already unlocked! Close this window.';
        unlockBtn.disabled = true;
        closeModalBtn.disabled = false;
        closeModalBtn.classList.add('enabled');
      }
    }

    function hideModal() {
      modalOverlay.classList.remove('active');
    }

    function unlockDoor() {
      if (isUnlocked) return;
      isUnlocked = true;
      unlockBtn.disabled = true;
      closeModalBtn.disabled = false;
      closeModalBtn.classList.add('enabled');
      modalStatus.textContent = '✅ Door unlocked! Close this window, then click the wheel.';
      console.log('🔓 Door unlocked – wheel is now ready to spin.');
    }

    function revealBolts() {
      if (boltsRevealed) return;
      boltsRevealed = true;
      console.log('🔧 Revealing bolts...');
      boltWrappers.forEach((wrapper, index) => {
        setTimeout(() => {
          wrapper.classList.add('unlocked');
          console.log(`✅ Bolt ${index + 1} revealed.`);
          // When the LAST bolt is revealed (index 2), stop the wheel and turn light green
          if (index === 2) {
            // Stop the wheel spinning
            wheel.classList.remove('spinning');
            isSpinning = false;
            console.log('🛑 Wheel stopped – all bolts revealed.');
            // Turn the light GREEN
            redlightWrapper.classList.add('green');
            console.log('🟢 Light turned GREEN!');
          }
        }, index * 400 + 200); // 200ms delay between each bolt
      });
    }

    function onWheelClick() {
      // If already spinning, ignore
      if (isSpinning) return;
      
      // If door is not unlocked yet, just jiggle
      if (!isUnlocked) {
        wheel.style.animation = 'none';
        void wheel.offsetHeight;
        wheel.style.animation = 'wheelJiggle 0.6s ease-in-out 2';
        setTimeout(() => {
          wheel.style.animation = 'wheelJiggle 2s ease-in-out infinite';
        }, 1200);
        console.log('⛔ Wheel is locked – use the keypad first.');
        return;
      }

      // If bolts are already revealed, do nothing
      if (boltsRevealed) {
        console.log('⏳ Door already unlocked – bolts already revealed.');
        return;
      }

      // ── START THE SPIN ──
      console.log('🔄 Wheel spinning continuously...');
      isSpinning = true;
      
      // Remove any existing animation, then start continuous spin
      wheel.style.animation = 'none';
      void wheel.offsetHeight;
      wheel.classList.add('spinning');

      // Start revealing bolts
      revealBolts();
    }

    // ── Event listeners ──
    keypad.addEventListener('click', showModal);
    unlockBtn.addEventListener('click', unlockDoor);
    closeModalBtn.addEventListener('click', function() {
      if (this.disabled) return;
      hideModal();
    });
    wheel.addEventListener('click', onWheelClick);
    modalOverlay.addEventListener('click', function(e) {
      if (e.target === modalOverlay && !closeModalBtn.disabled) {
        hideModal();
      }
    });

    // ── Initial state ──
    boltWrappers.forEach(w => w.classList.remove('unlocked'));
    redlightWrapper.classList.remove('green');
    console.log('🔐 Safe door ready – click keypad to start.');
  })();
</script>
</body>
</html>
